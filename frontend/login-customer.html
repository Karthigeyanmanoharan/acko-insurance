<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login · Acko.ai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans:    ['Inter', 'sans-serif'],
          },
          colors: {
            midnight: '#0a0e27',
            surface:  '#1a1f3a',
            neon:     '#00d9ff',
            violet:   '#a855f7',
            mint:     '#00ffa3',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-sans text-white min-h-screen overflow-x-hidden">

  <!-- Animated background -->
  <div class="fixed inset-0 -z-10 bg-midnight">
    <div class="absolute top-0 -left-32 w-96 h-96 bg-neon/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-0 -right-32 w-96 h-96 bg-violet/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1.5s;"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 px-6 py-5">
    <nav class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon to-violet flex items-center justify-center font-display font-bold text-midnight">A</div>
        <span class="font-display text-xl font-bold">Acko<span class="text-neon">.ai</span></span>
      </a>
      <a href="index.html" class="text-sm text-slate-400 hover:text-white transition">← Back</a>
    </nav>
  </header>

  <!-- Login card -->
  <main class="relative z-10 px-6 py-12 flex items-center justify-center">
    <div class="w-full max-w-md fade-in">

      <div class="text-center mb-8">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-neon/10 border border-neon/30 flex items-center justify-center mb-5">
          <svg class="w-7 h-7 text-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <h1 class="font-display text-4xl font-bold mb-2">Welcome Back</h1>
        <p class="text-slate-400 text-sm">Sign in to chat with your AI insurance assistant</p>
      </div>

      <div class="glass-card">
        <form id="login-form" class="space-y-5">

          <div>
            <label class="input-label">Email Address</label>
            <input id="email" type="email" required placeholder="you@example.com" class="input-field" />
          </div>

          <div>
            <label class="input-label">Password</label>
            <input id="password" type="password" required placeholder="Your password" class="input-field" />
          </div>

          <!-- Status message slot -->
          <div id="status-msg" class="hidden text-sm rounded-lg px-4 py-3"></div>

          <button id="submit-btn" type="submit" class="btn-primary w-full">
            Sign In →
          </button>

          <p class="text-center text-sm text-slate-400 pt-2">
            New to Acko?
            <a href="signup.html" class="text-neon hover:underline font-medium">Create an account</a>
          </p>

        </form>
      </div>

      <p class="text-center text-xs text-slate-500 mt-6">
        Are you an Acko employee?
        <a href="login-manager.html" class="text-violet hover:underline">Manager login →</a>
      </p>

    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login-customer.js"></script>
</body>
</html>
