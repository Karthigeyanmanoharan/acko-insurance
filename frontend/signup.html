<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · Acko.ai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans:    ['Inter', 'sans-serif'],
          },
          colors: {
            midnight: '#0a0e27',
            surface:  '#1a1f3a',
            neon:     '#00d9ff',
            violet:   '#a855f7',
            mint:     '#00ffa3',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-sans text-white min-h-screen overflow-x-hidden">

  <!-- Animated background -->
  <div class="fixed inset-0 -z-10 bg-midnight">
    <div class="absolute top-0 -left-32 w-96 h-96 bg-neon/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-0 -right-32 w-96 h-96 bg-violet/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1.5s;"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 px-6 py-5">
    <nav class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon to-violet flex items-center justify-center font-display font-bold text-midnight">A</div>
        <span class="font-display text-xl font-bold">Acko<span class="text-neon">.ai</span></span>
      </a>
      <a href="index.html" class="text-sm text-slate-400 hover:text-white transition">← Back</a>
    </nav>
  </header>

  <!-- Signup card -->
  <main class="relative z-10 px-6 py-12 flex items-center justify-center">
    <div class="w-full max-w-md fade-in">

      <div class="text-center mb-8">
        <h1 class="font-display text-4xl font-bold mb-2">Create Account</h1>
        <p class="text-slate-400 text-sm">Join 2.8Cr+ Indians on India's smartest insurance platform</p>
      </div>

      <div class="glass-card">
        <form id="signup-form" class="space-y-5">

          <div>
            <label class="input-label">Full Name</label>
            <input id="name" type="text" required placeholder="Priya Sharma" class="input-field" />
          </div>

          <div>
            <label class="input-label">Email Address</label>
            <input id="email" type="email" required placeholder="you@example.com" class="input-field" />
          </div>

          <div>
            <label class="input-label">Phone Number</label>
            <input id="phone" type="tel" placeholder="9876543210" maxlength="10" class="input-field" />
          </div>

          <div>
            <label class="input-label">Password</label>
            <input id="password" type="password" required minlength="6" placeholder="At least 6 characters" class="input-field" />
          </div>

          <!-- Status message slot -->
          <div id="status-msg" class="hidden text-sm rounded-lg px-4 py-3"></div>

          <button id="submit-btn" type="submit" class="btn-primary w-full">
            Create Account →
          </button>

          <p class="text-center text-sm text-slate-400 pt-2">
            Already have an account?
            <a href="login-customer.html" class="text-neon hover:underline font-medium">Log in</a>
          </p>

        </form>
      </div>

      <p class="text-center text-xs text-slate-500 mt-6">
        By signing up, you agree to Acko's Terms of Service & Privacy Policy.
      </p>

    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
